name: CI Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'rag_backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'rag_backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/test_password
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'rag_backend/requirements.txt'

      - name: 安装依赖
        run: |
          pip install -r rag_backend/requirements.txt

      - name: 代码检查 - Ruff
        run: |
          pip install ruff
          cd rag_backend && ruff check app/ --output-format=github
        continue-on-error: true

      - name: 代码类型检查 - MyPy
        run: |
          pip install mypy
          cd rag_backend && mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: 运行测试
        working-directory: rag_backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test_password
        run: |
          if [ -d "tests/" ]; then pytest tests/ -v --tb=short; fi

      - name: 生成测试覆盖率报告
        if: success()
        working-directory: rag_backend
        run: |
          if [ -d "tests/" ]; then pytest tests/ --cov=app --cov-report=xml --cov-report=html; fi

      - name: 上传覆盖率报告
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: rag_backend/htmlcov/
          retention-days: 7

  lint:
    name: 代码质量
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install ruff mypy

      - name: Ruff 检查
        run: cd rag_backend && ruff check app/

      - name: MyPy 类型检查
        run: cd rag_backend && mypy app/ --ignore-missing-imports --no-error-summary
