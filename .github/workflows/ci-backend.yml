name: CI Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'rag_backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'rag_backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag_backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rag_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v --tb=short

      - name: Generate coverage report
        if: success()
        run: pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: rag_backend/htmlcov/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rag_backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Ruff
        run: ruff check app/

      - name: MyPy
        run: mypy app/ --ignore-missing-imports --no-error-summary
