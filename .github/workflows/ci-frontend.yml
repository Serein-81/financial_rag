name: CI Frontend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'rag_frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'rag_frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: rag_frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rag_frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm run test

      - name: 运行单元测试
        run: npm run test:unit
        continue-on-error: true

  lint:
    name: 代码质量
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: rag_frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rag_frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 类型检查
        run: npm run type-check
        continue-on-error: true

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: lint
    
    defaults:
      run:
        working-directory: rag_frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rag_frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建生产版本
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: rag_frontend/dist/
          retention-days: 7
