name: CI MCP Server

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mcp_server/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'mcp_server/**'
      - '.github/workflows/ci-mcp.yml'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp_server

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mcp_server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp_server

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Ruff
        run: ruff check app/

      - name: MyPy
        run: mypy app/ --ignore-missing-imports --no-error-summary
