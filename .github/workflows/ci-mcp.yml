name: CI MCP Server

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mcp_server/**'
      - '.github/workflows/ci-mcp.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'mcp_server/**'
      - '.github/workflows/ci-mcp.yml'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: mcp_server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mcp_server/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行测试
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true

  lint:
    name: 代码质量
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: mcp_server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install ruff mypy

      - name: Ruff 检查
        run: ruff check app/

      - name: MyPy 类型检查
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true
