services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    restart: always
    environment:
      # Docker 会自动从 .env 中读取这些变量
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: