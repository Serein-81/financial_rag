# PostgreSQL pg_hba.conf 配置
# 添加 Docker 网络信任规则

# 允许 Docker 网络 (172.16.0.0/12) 使用 trust 认证
host    all             all             172.16.0.0/12            trust

# 其他规则保持不变
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host all all all scram-sha-256
