; ===========================================
; PgBouncer Transaction 模式配置文件
; 使用 trust 认证（仅用于开发环境）
; ===========================================

[databases]
; PgBouncer 预先连接到 PostgreSQL
rag_db = host=db port=5432 dbname=rag_db user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; trust 认证 - 信任来自 Docker 网络的连接
auth_type = trust

; 连接池模式
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

; 连接管理
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3

; 查询管理
query_timeout = 30
query_wait_timeout = 30
idle_transaction_timeout = 300
server_reset_query = DISCARD ALL

; 日志配置
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; TCP Keepalive
tcp_keepalive = 1

; 错误处理
ignore_startup_parameters = extra_float_digits
server_check_delay = 30
