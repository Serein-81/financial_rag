; ===========================================
; PgBouncer Transaction 模式配置文件
; 用于 Docker 容器环境
; ===========================================

[databases]
; 格式: 数据库名 = host=主机 port=端口 dbname=数据库名 user=用户名 password=密码
rag_db = host=db port=5432 dbname=rag_db user=postgres password=REDACTED_PG_PASSWORD

[pgbouncer]
; 网络配置
listen_addr = 0.0.0.0
listen_port = 5432

; 认证配置
; auth_type = trust 表示信任所有来自 Docker 网络的连接
; 仅用于开发环境，生产环境应使用更严格的认证方式
auth_type = trust

; 连接池模式 (关键配置！)
; - transaction: 事务模式（每个事务后归还连接，应用需要移除 SET LOCAL）
; - session: 会话模式（保持连接直到客户端断开，支持 SET LOCAL）
pool_mode = transaction

; 连接池大小配置
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

; 连接管理
server_lifetime = 7200
server_idle_timeout = 1800
server_connect_timeout = 15
server_login_retry = 3

; 查询管理
query_timeout = 30
query_wait_timeout = 30
idle_transaction_timeout = 1800

; Transaction 模式下使用 DISCARD ALL 清理会话状态
server_reset_query = DISCARD ALL

; 日志配置
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; TCP Keepalive
tcp_keepalive = 1

; 错误处理
ignore_startup_parameters = extra_float_digits

; 连接健康检查
server_check_delay = 30
