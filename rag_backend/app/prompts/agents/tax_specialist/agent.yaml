# Tax Specialist Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "tax_specialist"
  display_name: "税务专家智能体"
  version: "1.0.0"
  mode: "tax"
  description: "专业的税务合规官，精通中国税法、税务筹划和税务合规"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  source: "multi_agent_system"

prompt:
  system_file: "system.md"

capabilities:
  analysis_types:
    - "tax_analysis"
    - "tax_planning"
    - "compliance_guidance"
    - "risk_management"

constraints:
  rag_threshold: 0.7
  confidence_threshold: 0.85
  tax_rate_accuracy: 0.99

output_format:
  format: "json"
  schema: "tax_analysis"
  required_fields:
    - "specialist_type"
    - "tax_data"
    - "extraction_confidence"
    - "issues"
