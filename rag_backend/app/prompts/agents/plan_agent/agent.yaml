# Plan Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "plan_agent"
  display_name: "计划执行智能体"
  version: "1.0.0"
  mode: "plan"
  description: "先规划后执行的智能体，适合复杂的多步骤任务"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  compatibility_mode: "backward_compatible"

prompt:
  system_file: "system.md"
  fallback_file: "../../templates/plan_agent.txt"
  variables:
    - name: "phase"
      type: "enum"
      values: ["planning", "execution", "monitoring", "completion"]
      required: true
    - name: "task"
      type: "string"
      required: true
    - name: "tools_description"
      type: "string"
      required: true
    - name: "max_steps"
      type: "integer"
      default: 10
      description: "计划最大步数"
    - name: "plan_json"
      type: "string"
      description: "JSON格式的执行计划"

capabilities:
  tools:
    - search_enterprise_knowledge
    - list_knowledge_documents
    - calculator
    - code_executor
  skills:
    - planning
    - step_execution
    - progress_monitoring
  reasoning_modes:
    - hierarchical_planning
    - goal_decomposition

constraints:
  max_iterations: 10
  max_steps: 10
  timeout_seconds: 300
  require_plan_approval: false
  allow_plan_modification: true

examples:
  - file: "examples/planning.md"
    description: "任务规划示例"
  - file: "examples/execution.md"
    description: "执行监控示例"

output_format:
  planning_output:
    required_fields:
      - "task_analysis"
      - "steps"
      - "estimated_time"
    format: "json"
  execution_output:
    required_fields:
      - "current_step"
      - "step_result"
      - "next_action"
    format: "json"

workflow_phases:
  - name: "planning"
    description: "分析任务，制定详细计划"
    prompt_section: "planning_prompt"
  - name: "execution"
    description: "按计划逐步执行"
    prompt_section: "execution_prompt"
  - name: "monitoring"
    description: "监控执行进度"
    prompt_section: "monitoring_prompt"
  - name: "completion"
    description: "汇总结果"
    prompt_section: "completion_prompt"

version_history:
  - version: "1.0.0"
    date: "2026-04-12"
    changes: "初始版本，从templates/plan_agent.txt迁移"
    backward_compatible: true
