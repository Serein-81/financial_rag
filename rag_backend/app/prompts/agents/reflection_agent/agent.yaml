# Reflection Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "reflection_agent"
  display_name: "反思改进智能体"
  version: "1.0.0"
  mode: "reflect"
  description: "执行后进行反思和改进的智能体，适合高质量要求的任务"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  compatibility_mode: "backward_compatible"

prompt:
  system_file: "system.md"
  variables:
    - name: "task"
      type: "string"
      required: true
    - name: "initial_output"
      type: "string"
      required: true
      description: "初始输出结果"
    - name: "criteria"
      type: "string"
      description: "评估标准"
    - name: "feedback"
      type: "string"
      description: "反馈信息"

capabilities:
  tools:
    - search_enterprise_knowledge
    - list_knowledge_documents
  skills:
    - self_critique
    - quality_assessment
    - iterative_improvement
  reasoning_modes:
    - self_reflection
    - quality_check

constraints:
  max_iterations: 5
  max_reflection_rounds: 3
  timeout_seconds: 300
  quality_threshold: 0.8
  require_explanation: true

examples:
  - file: "examples/reflection.md"
    description: "反思示例"

output_format:
  reflection_output:
    required_fields:
      - "strengths"
      - "weaknesses"
      - "improvements"
    format: "json"
  final_output:
    required_fields:
      - "content"
      - "quality_score"
      - "confidence"
    format: "json"

reflection_stages:
  - name: "initial_response"
    description: "生成初始响应"
  - name: "self_review"
    description: "自我审查"
  - name: "feedback_integration"
    description: "整合反馈"
  - name: "improvement"
    description: "改进输出"
  - name: "final_verification"
    description: "最终验证"

version_history:
  - version: "1.0.0"
    date: "2026-04-12"
    changes: "初始版本"
    backward_compatible: true
