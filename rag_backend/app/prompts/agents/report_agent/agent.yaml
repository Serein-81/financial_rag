# Report Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "report_agent"
  display_name: "报表生成智能体"
  version: "1.0.0"
  mode: "report"
  description: "专门生成各类企业报表（财务、销售、库存、运营）"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  compatibility_mode: "backward_compatible"

prompt:
  system_file: "system.md"
  fallback_file: "../../report_agent/report_prompt.txt"
  sub_prompts:
    - name: "financial"
      file: "financial_report.md"
      fallback_file: "../../report_agent/financial_report.txt"
    - name: "sales"
      file: "sales_report.md"
      fallback_file: "../../report_agent/sales_report.txt"
    - name: "inventory"
      file: "inventory_report.md"
      fallback_file: "../../report_agent/inventory_report.txt"
    - name: "operation"
      file: "operation_report.md"
      fallback_file: "../../report_agent/operation_report.txt"

capabilities:
  report_types:
    - "financial_report"
    - "sales_report"
    - "inventory_report"
    - "operation_report"
  analysis_types:
    - "trend_analysis"
    - "comparison_analysis"
    - "risk_assessment"
    - "recommendation"

constraints:
  max_generation_time: 120
  min_data_points: 3
  report_formats:
    - "markdown"
    - "json"
  quality_threshold: 0.7

output_format:
  format: "markdown"
  structure:
    - "title"
    - "summary"
    - "data_analysis"
    - "findings"
    - "recommendations"
  tables:
    required_for_data: true
    min_rows: 3
  charts:
    allowed: false
    description_only: true

report_templates:
  financial_report:
    sections:
      - "收入分析"
      - "支出分析"
      - "利润率"
      - "税务汇总"
      - "风险提示"
  sales_report:
    sections:
      - "销售概况"
      - "业绩排名"
      - "趋势分析"
      - "改进建议"
  inventory_report:
    sections:
      - "库存概览"
      - "周转分析"
      - "风险预警"
      - "优化建议"
  operation_report:
    sections:
      - "运营指标"
      - "效率分析"
      - "问题诊断"
      - "改进方案"

version_history:
  - version: "1.0.0"
    date: "2026-04-12"
    changes: "从report_agent/目录迁移"
    backward_compatible: true
