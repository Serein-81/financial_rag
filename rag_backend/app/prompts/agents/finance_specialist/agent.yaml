# Finance Specialist Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "finance_specialist"
  display_name: "财务专家智能体"
  version: "1.0.0"
  mode: "finance"
  description: "专业的财务审计官，精通财务分析、投资评估、成本控制和财务规划"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  source: "multi_agent_system"

prompt:
  system_file: "system.md"

capabilities:
  analysis_types:
    - "financial_analysis"
    - "investment_evaluation"
    - "cost_control"
    - "financial_planning"
  data_operations:
    - "get_financial_overview"
    - "query_financial_data"
    - "get_financial_trend"
    - "search_financial_data"

constraints:
  rag_threshold: 0.7
  max_data_points: 1000
  confidence_threshold: 0.8

output_format:
  format: "json"
  schema: "finance_analysis"
  required_fields:
    - "specialist_type"
    - "rag_decision"
    - "analysis"
    - "recommendations"
