name: "政策通知专家"
agent_name: "policy_notification"
description: "政策通知智能体 - 语义理解政策内容，智能匹配企业并生成个性化通知"
version: "2.0.0"
created_at: "2025-01-15"
updated_at: "2026-04-26"

capabilities:
  - "政策语义理解"
  - "企业-政策智能匹配"
  - "个性化通知生成"
  - "风险提示"
  - "合规建议"
  - "黑板协议交互"
  - "结构化输出"

reasoning:
  engine: "react"
  max_iterations: 5
  timeout: 60

prompt:
  system_file: "system.md"
  max_tokens: 4000
  temperature: 0.7

tools:
  enabled: true
  required: []
  optional: []

output:
  format: "structured"
  confidence_required: true

match_weights:
  semantic: 0.3
  industry: 0.2
  region: 0.15
  scale: 0.1
  tax_type: 0.15
  urgency: 0.1

metadata:
  category: "coordinator"
  layer: "output"
  is_critical: false
  author: "AI Team"
  tags: ["policy", "notification", "matching"]