# Output Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12

agent:
  name: "output_agent"
  display_name: "统一输出智能体"
  version: "1.0.0"
  mode: "output"
  description: "负责多智能体结果合成、冲突检测与解决、输出质量审查"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  compatibility_mode: "backward_compatible"

prompt:
  system_file: "system.md"
  fallback_file: "../../output_agent/system_prompt.txt"
  sub_prompts:
    - name: "synthesis"
      file: "synthesis.md"
      fallback_file: "../../output_agent/synthesis_prompt.txt"
    - name: "quick_review"
      file: "quick_review.md"
      fallback_file: "../../output_agent/quick_review_prompt.txt"
    - name: "deep_review"
      file: "deep_review.md"
      fallback_file: "../../output_agent/deep_review_prompt.txt"
    - name: "regeneration"
      file: "regeneration.md"
      fallback_file: "../../output_agent/regeneration_hint_prompt.txt"

capabilities:
  synthesis_strategies:
    - "concatenate"
    - "merge"
    - "hierarchical"
    - "narrative"
  conflict_resolutions:
    - "latest"
    - "highest_confidence"
    - "vote"
    - "priority"
    - "manual"
  quality_checks:
    - "format_validation"
    - "content_completeness"
    - "safety_check"
    - "style_consistency"

constraints:
  max_inputs: 10
  quality_score_min: 0.6
  length_limits:
    min_chars: 50
    max_chars: 2500
  timeout_seconds: 60

output_format:
  format: "json"
  fields:
    synthesis_id: "string"
    task_id: "string"
    strategy: "string"
    raw_inputs: "array"
    conflicts: "array"
    resolved_content: "object"
    final_response: "string"
    confidence: "float"
    quality_score: "float"

quality_rules:
  length:
    total_min: 1500
    total_max: 2500
    paragraph_min: 50
    paragraph_max: 150
  formatting:
    title_levels: [1, 2, 3]
    emoji_allowed: true
    emoji_positions: ["title", "attention", "suggestion"]
    table_only_with_data: true
    min_table_rows: 3

version_history:
  - version: "1.0.0"
    date: "2026-04-12"
    changes: "从output_agent/目录迁移"
    backward_compatible: true
