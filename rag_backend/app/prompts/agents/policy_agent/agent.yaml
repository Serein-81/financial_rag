# Policy Agent 配置
# 版本: 1.0.0
# 最后更新: 2026-04-12
# 注意: 此agent的提示词硬编码在代码中，此处为元数据记录

agent:
  name: "policy_agent"
  display_name: "政策智能体"
  version: "1.0.0"
  mode: "policy"
  description: "政策采集和理解专家，负责政策信息采集、解析、理解和影响分析"

metadata:
  created_at: "2026-04-12"
  updated_at: "2026-04-12"
  owner: "backend-team"
  status: "active"
  source: "multi_agent_system"

prompt:
  system_file: "system.md"
  fallback_file: null  # 提示词硬编码在 policy_agent.py 中

capabilities:
  tasks:
    - "policy_collection"
    - "policy_parsing"
    - "policy_understanding"
    - "impact_analysis"

policy_types:
  - "tax_policy"
  - "financial_policy"
  - "regulatory_policy"
  - "industry_policy"

impact_levels:
  - "high"
  - "medium"
  - "low"

output_format:
  format: "json"
  schema: "policy_analysis"
  required_fields:
    - "policy_type"
    - "impact_level"
    - "key_points"
    - "affected_areas"
