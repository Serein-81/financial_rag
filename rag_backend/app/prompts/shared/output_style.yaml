# 输出格式规范
# 统一所有Agent的输出格式标准

## 1. 结构化输出规范

### JSON输出标准
```json
{
  "status": "success|error|warning",
  "data": {},
  "message": "提示信息",
  "errors": [],
  "warnings": [],
  "metadata": {
    "timestamp": "ISO时间戳",
    "version": "版本号",
    "confidence": 0.95
  }
}
```

### Markdown输出标准

#### 标题层级
```
# 一级标题（报告标题）
## 二级标题（主要章节）
### 三级标题（子章节）
#### 四级标题（具体内容）
```

#### 列表格式
- 无序列表使用 `-` 或 `*`
- 有序列表使用 `1.` `2.` `3.`
- 嵌套列表缩进2个空格

#### 代码块
- 使用三个反引号包裹
- 指定语言以获得语法高亮
- 保持代码整洁

#### 表格格式
```markdown
| 列1 | 列2 | 列3 |
|------|------|------|
| 内容 | 内容 | 内容 |
```

## 2. 专业术语使用

### 术语规范
- 首次出现时提供解释
- 使用行业标准术语
- 避免生造词汇

### 缩写处理
- 首次使用全称+缩写
- 后续可使用缩写
- 确保不产生歧义

## 3. 数字和单位

### 数字格式
- 使用阿拉伯数字（0-9）
- 大数字使用千分位分隔
- 小数点后保留2位（财务数据）

### 单位使用
- 国际单位制（SI）
- 明确标注单位
- 保持单位一致性

### 货币格式
- 标注货币类型（¥/$/€）
- 大写金额（合同场景）
- 小数点后2位

## 4. 日期时间格式

### 日期格式
- 使用 ISO 格式：YYYY-MM-DD
- 中文场景可用：YYYY年MM月DD日
- 明确时区

### 时间格式
- 使用24小时制：HH:mm:ss
- 或12小时制：HH:mm AM/PM
- 标注时区

## 5. 置信度标注

### 置信度等级
- **高置信度**（≥0.9）：非常有把握
- **中置信度**（0.7-0.9）：比较把握
- **低置信度**（0.5-0.7）：一般把握
- **不确定**（<0.5）：建议核实

### 置信度标注方式
```markdown
**置信度**：0.92（高）

或者在JSON中：
"confidence": {
  "score": 0.92,
  "level": "high",
  "reasoning": "基于充分的信息来源"
}
```

## 6. 引用和参考

### 引用格式
```markdown
来源：[1] 《中华人民共和国企业所得税法》第二条
      [2] 国家税务总局公告2024年第5号
```

### 参考列表
```markdown
## 参考资料

1. [文档标题](URL) - 访问日期
2. [文档标题](URL) - 访问日期
```

## 7. 免责声明

### 通用免责声明
"本回答仅供参考和学习交流之用，不构成正式建议。具体事务请咨询专业人士。"

### 税务免责声明
"本回答不构成正式税务咨询，具体税务处理请以主管税务机关的规定为准。"

### 法律免责声明
"本回答不构成正式法律意见，具体法律事务请咨询执业律师。"

## 8. 风险提示

### 风险标注格式
```markdown
⚠️ **风险提示**
- 风险描述
- 潜在影响
- 建议措施
```

### 重要提示
```markdown
❗ **重要**
- 关键信息
- 必须注意的事项
```

## 9. 行动建议格式

### 行动项结构
```markdown
## 建议行动

### 立即行动（优先级：高）
- [ ] 行动项1
- [ ] 行动项2

### 短期行动（优先级：中）
- [ ] 行动项3
- [ ] 行动项4

### 长期规划（优先级：低）
- [ ] 行动项5
```

## 10. 错误处理输出

### 用户友好错误
```json
{
  "status": "error",
  "error": {
    "code": "DATA_NOT_FOUND",
    "message": "未找到相关数据",
    "suggestion": "请尝试其他查询条件"
  }
}
```

### 技术错误（调试用）
```json
{
  "status": "error",
  "error": {
    "code": "INTERNAL_ERROR",
    "message": "内部错误",
    "details": "详细错误信息",
    "trace_id": "追踪ID"
  }
}
```

## 11. 可读性优化

### 段落长度
- 单段落不超过5-6句
- 长段落拆分为多个短段落
- 使用空行分隔

### 重点突出
- 使用**粗体**突出关键词
- 使用*斜体*表示强调
- 使用列表提高可读性

### 视觉层次
- 合理使用标题层级
- 适当使用空行和缩进
- 避免信息过密

## 12. 多语言处理

### 中文规范
- 使用中文标点符号（，。：；？！）
- 专有名词使用标准译名
- 保持语言风格一致

### 中英混排
- 英文词组用中文夹注
- 保持中英文比例合理
- 专业术语首次给出中文解释
