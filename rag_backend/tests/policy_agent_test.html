<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策通知智能体测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
        }
        
        .section:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }
        
        .section-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title .icon {
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            margin: 5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(235, 51, 73, 0.3);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        
        .result.loading {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        
        .result-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .result-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .score-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        
        .score-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }
        
        .score-item .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .score-item .value {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
        }
        
        .notification-preview {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 5px solid #667eea;
        }
        
        .notification-preview h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .notification-preview .urgency {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .urgency.high {
            background: #dc3545;
            color: white;
        }
        
        .urgency.medium {
            background: #ffc107;
            color: #333;
        }
        
        .urgency.low {
            background: #28a745;
            color: white;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .tab:hover {
            background: #f5f5f5;
        }
        
        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin: 10px 0;
        }
        
        .status-badge.llm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .status-badge.fallback {
            background: #6c757d;
            color: white;
        }
        
        .test-data-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .test-data-section h4 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .test-data-btn {
            margin: 5px;
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .test-data-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 政策通知智能体测试</h1>
            <p>PolicyNotificationAgent - 企业政策智能匹配与通知生成</p>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">
                    <span class="icon">📊</span>
                    智能体状态
                </div>
                <button class="btn btn-primary" onclick="checkStatus()">
                    查看智能体状态
                </button>
                <div id="status-result" class="result"></div>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('match')">政策匹配</div>
                <div class="tab" onclick="switchTab('notify')">通知生成</div>
                <div class="tab" onclick="switchTab('prioritize')">优先级排序</div>
                <div class="tab" onclick="switchTab('test')">完整流程测试</div>
            </div>
            
            <div id="match-tab" class="tab-content active">
                <div class="section">
                    <div class="section-title">
                        <span class="icon">🔍</span>
                        政策-企业匹配测试
                    </div>
                    
                    <div class="test-data-section">
                        <h4>快速加载测试数据</h4>
                        <button class="test-data-btn" onclick="loadMatchTestData()">加载测试数据</button>
                    </div>
                    
                    <div class="grid-2">
                        <div>
                            <h3>政策信息</h3>
                            <div class="form-group">
                                <label>政策ID</label>
                                <input type="text" id="match-policy-id" placeholder="例如: POL-2024-001">
                            </div>
                            <div class="form-group">
                                <label>政策标题</label>
                                <input type="text" id="match-policy-title" placeholder="例如: 高新技术企业税收优惠">
                            </div>
                            <div class="form-group">
                                <label>政策内容</label>
                                <textarea id="match-policy-content" placeholder="请输入政策全文内容..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>优先级</label>
                                <select id="match-policy-priority">
                                    <option value="high">高 (high)</option>
                                    <option value="medium" selected>中 (medium)</option>
                                    <option value="low">低 (low)</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <h3>企业画像</h3>
                            <div class="form-group">
                                <label>企业ID</label>
                                <input type="text" id="match-enterprise-id" placeholder="例如: ENT-001">
                            </div>
                            <div class="form-group">
                                <label>企业名称</label>
                                <input type="text" id="match-enterprise-name" placeholder="例如: 科技创新有限公司">
                            </div>
                            <div class="form-group">
                                <label>所属行业</label>
                                <input type="text" id="match-enterprise-industry" placeholder="例如: 信息技术">
                            </div>
                            <div class="form-group">
                                <label>所在地区</label>
                                <input type="text" id="match-enterprise-region" placeholder="例如: 北京">
                            </div>
                            <div class="form-group">
                                <label>企业规模</label>
                                <select id="match-enterprise-scale">
                                    <option value="small">小微企业</option>
                                    <option value="medium" selected>中型企业</option>
                                    <option value="large">大型企业</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>纳税类型 (逗号分隔)</label>
                                <input type="text" id="match-enterprise-tax-types" placeholder="例如: 增值税, 企业所得税">
                            </div>
                            <div class="form-group">
                                <label>资质认证 (逗号分隔)</label>
                                <input type="text" id="match-enterprise-qualifications" placeholder="例如: 高新技术企业, 软件企业">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="match-use-llm" checked>
                            使用 LLM 智能匹配
                        </label>
                    </div>
                    
                    <button class="btn btn-success" onclick="testMatch()">
                        测试匹配
                    </button>
                    
                    <div id="match-result" class="result"></div>
                </div>
            </div>
            
            <div id="notify-tab" class="tab-content">
                <div class="section">
                    <div class="section-title">
                        <span class="icon">📝</span>
                        通知生成测试
                    </div>
                    
                    <div class="test-data-section">
                        <h4>快速加载测试数据</h4>
                        <button class="test-data-btn" onclick="loadNotifyTestData()">加载测试数据</button>
                    </div>
                    
                    <div class="form-group">
                        <label>匹配结果 (JSON)</label>
                        <textarea id="notify-match-result" placeholder="请先执行匹配测试获取结果，或手动输入..."></textarea>
                    </div>
                    
                    <button class="btn btn-success" onclick="testNotify()">
                        生成通知
                    </button>
                    
                    <div id="notify-result" class="result"></div>
                </div>
            </div>
            
            <div id="prioritize-tab" class="tab-content">
                <div class="section">
                    <div class="section-title">
                        <span class="icon">📊</span>
                        政策优先级排序测试
                    </div>
                    
                    <div class="test-data-section">
                        <h4>快速加载测试数据</h4>
                        <button class="test-data-btn" onclick="loadPrioritizeTestData()">加载测试数据</button>
                    </div>
                    
                    <div class="form-group">
                        <label>政策列表 (JSON 数组)</label>
                        <textarea id="prioritize-policies" rows="10" placeholder="请输入政策列表..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>企业画像 (JSON)</label>
                        <textarea id="prioritize-enterprise" rows="5" placeholder="请输入企业画像..."></textarea>
                    </div>
                    
                    <button class="btn btn-success" onclick="testPrioritize()">
                        排序政策
                    </button>
                    
                    <div id="prioritize-result" class="result"></div>
                </div>
            </div>
            
            <div id="test-tab" class="tab-content">
                <div class="section">
                    <div class="section-title">
                        <span class="icon">🧪</span>
                        完整流程测试
                    </div>
                    <p style="margin-bottom: 20px; color: #666;">
                        测试政策智能体的完整流程：匹配 → 生成通知 → 优先级排序
                    </p>
                    
                    <div class="test-data-section">
                        <h4>快速加载测试数据</h4>
                        <button class="test-data-btn" onclick="loadFullTestData()">加载完整测试数据</button>
                    </div>
                    
                    <div class="grid-2">
                        <div>
                            <h3>政策列表</h3>
                            <div class="form-group">
                                <label>政策列表 (JSON 数组)</label>
                                <textarea id="test-policies" rows="15" placeholder="请输入政策列表..."></textarea>
                            </div>
                        </div>
                        
                        <div>
                            <h3>企业画像</h3>
                            <div class="form-group">
                                <label>企业ID</label>
                                <input type="text" id="test-enterprise-id" placeholder="例如: ENT-001">
                            </div>
                            <div class="form-group">
                                <label>企业名称</label>
                                <input type="text" id="test-enterprise-name" placeholder="例如: 科技创新有限公司">
                            </div>
                            <div class="form-group">
                                <label>所属行业</label>
                                <input type="text" id="test-enterprise-industry" placeholder="例如: 信息技术">
                            </div>
                            <div class="form-group">
                                <label>所在地区</label>
                                <input type="text" id="test-enterprise-region" placeholder="例如: 北京">
                            </div>
                            <div class="form-group">
                                <label>企业规模</label>
                                <select id="test-enterprise-scale">
                                    <option value="small">小微企业</option>
                                    <option value="medium" selected>中型企业</option>
                                    <option value="large">大型企业</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>纳税类型 (逗号分隔)</label>
                                <input type="text" id="test-enterprise-tax-types" placeholder="例如: 增值税, 企业所得税">
                            </div>
                            <div class="form-group">
                                <label>资质认证 (逗号分隔)</label>
                                <input type="text" id="test-enterprise-qualifications" placeholder="例如: 高新技术企业">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="test-use-llm" checked>
                            使用 LLM 智能处理
                        </label>
                    </div>
                    
                    <button class="btn btn-success" onclick="testFullFlow()">
                        运行完整测试
                    </button>
                    
                    <div id="test-result" class="result"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api/v1/policy-agent';
        
        let authToken = '';
        
        async function makeRequest(url, method, data) {
            showLoading('正在发送请求...');
            
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: method !== 'GET' ? JSON.stringify(data) : null
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                return result;
                
            } catch (error) {
                throw error;
            }
        }
        
        function showLoading(message) {
            const resultDiv = document.querySelector('.result:not(.loading)');
            if (resultDiv) {
                resultDiv.className = 'result loading';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<div class="loading-spinner"></div>${message}`;
            }
        }
        
        function showSuccess(title, data) {
            const resultDiv = document.getElementById(event.target.closest('.section').querySelector('.result').id);
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="result-title">✅ ${title}</div>
                <div class="result-content">
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }
        
        function showError(title, error) {
            const resultDiv = document.getElementById(event.target.closest('.section').querySelector('.result').id);
            resultDiv.className = 'result error';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="result-title">❌ ${title}</div>
                <div class="result-content">
                    <pre>${error.toString()}</pre>
                </div>
            `;
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.querySelector(`.tab:nth-child(${['match', 'notify', 'prioritize', 'test'].indexOf(tabName) + 1})`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }
        
        async function checkStatus() {
            try {
                showLoading('正在获取智能体状态...');
                const data = await makeRequest(`${API_BASE}/status`, 'GET', null);
                
                const statusDiv = document.getElementById('status-result');
                statusDiv.className = 'result success';
                statusDiv.style.display = 'block';
                
                const llmBadge = data.use_llm ? 
                    `<span class="status-badge llm">🤖 LLM 模式 (${data.llm_provider})</span>` :
                    `<span class="status-badge fallback">📋 规则引擎模式</span>`;
                
                statusDiv.innerHTML = `
                    <div class="result-title">📊 智能体状态</div>
                    ${llmBadge}
                    <div class="score-card">
                        <div class="score-item">
                            <div class="label">政策理解</div>
                            <div class="value">${data.agent_capabilities.policy_understanding ? '✅' : '❌'}</div>
                        </div>
                        <div class="score-item">
                            <div class="label">语义匹配</div>
                            <div class="value">${data.agent_capabilities.semantic_matching ? '✅' : '❌'}</div>
                        </div>
                        <div class="score-item">
                            <div class="label">个性化生成</div>
                            <div class="value">${data.agent_capabilities.personalized_generation ? '✅' : '❌'}</div>
                        </div>
                        <div class="score-item">
                            <div class="label">回退模式</div>
                            <div class="value">${data.agent_capabilities.fallback_mode ? '✅' : '❌'}</div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                showError('获取状态失败', error);
            }
        }
        
        async function testMatch() {
            try {
                const policy = {
                    policy_id: document.getElementById('match-policy-id').value,
                    title: document.getElementById('match-policy-title').value,
                    content: document.getElementById('match-policy-content').value,
                    source: 'manual',
                    priority: document.getElementById('match-policy-priority').value
                };
                
                const enterprise = {
                    enterprise_id: document.getElementById('match-enterprise-id').value,
                    enterprise_name: document.getElementById('match-enterprise-name').value,
                    industry: document.getElementById('match-enterprise-industry').value,
                    region: document.getElementById('match-enterprise-region').value,
                    scale: document.getElementById('match-enterprise-scale').value,
                    tax_types: document.getElementById('match-enterprise-tax-types').value.split(',').map(s => s.trim()).filter(s => s),
                    qualifications: document.getElementById('match-enterprise-qualifications').value.split(',').map(s => s.trim()).filter(s => s)
                };
                
                const use_llm = document.getElementById('match-use-llm').checked;
                
                showLoading('正在进行政策匹配...');
                const data = await makeRequest(`${API_BASE}/match`, 'POST', { policy, enterprise, use_llm });
                
                const matchDiv = document.getElementById('match-result');
                matchDiv.className = 'result success';
                matchDiv.style.display = 'block';
                
                matchDiv.innerHTML = `
                    <div class="result-title">✅ 匹配完成</div>
                    <div class="score-card">
                        <div class="score-item">
                            <div class="label">总匹配度</div>
                            <div class="value">${(data.match_score * 100).toFixed(1)}%</div>
                        </div>
                        <div class="score-item">
                            <div class="label">语义匹配</div>
