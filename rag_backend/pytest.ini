[pytest]
# pytest configuration

# markers
markers =
    asyncio: mark async tests
    slow: mark slow tests
    integration: mark integration tests
    unit: mark unit tests

# 忽略掉所有不需要扫描的目录
norecursedirs = postgres_data node_modules .venv venv .git __pycache__ .pytest_cache
# 只搜索 tests 文件夹
testpaths = tests
# 添加 asyncio 配置
asyncio_mode = auto

# file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# output control
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers

# coverage
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
