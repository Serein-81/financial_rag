[pytest]
# Pytest configuration for tests that should run in a clean container.

markers =
    asyncio: mark async tests
    slow: mark slow tests
    integration: mark integration tests
    unit: mark unit tests

norecursedirs = postgres_data node_modules .venv venv .git __pycache__ .pytest_cache

# Default test run is limited to offline unit tests. API/integration tests
# require live services, databases, or provider credentials and should be run
# explicitly when those dependencies are available.
testpaths = tests/unit

asyncio_mode = auto

python_files = test_*.py
python_classes = Test*
python_functions = test_*

console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers

[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
