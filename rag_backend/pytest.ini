[pytest]
# pytest configuration

# markers
markers =
    asyncio: mark async tests
    slow: mark slow tests
    integration: mark integration tests
    unit: mark unit tests

# test directory
testpaths = tests

# file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# output control
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers

# coverage
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
