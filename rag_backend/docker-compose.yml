services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 限制 PG 最大内存，防止缓冲池吃光系统内存
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Redis 内存
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: rag_pgbouncer
    restart: always
    ports:
      - "6432:5432"
    environment:
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
    volumes:
      - ./docker/pgbouncer_transaction_mode.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -r stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  neo4j:
    image: neo4j:5.15-community
    container_name: rag_neo4j
    restart: always
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt 协议
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_max__size=512M # 限制 Java 堆内存（Neo4j 5 新键名，原 dbms.* 已弃用）
    volumes:
      - ./neo4j_data:/data
    # Neo4j 的真实健康探测，确保图谱引擎真正 Ready
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 限制容器总内存（配合堆内存设置，防止堆外内存泄露）
    deploy:
      resources:
        limits:
          memory: 1G

  minio:
    image: quay.io/minio/minio:latest
    container_name: rag_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 限制 MinIO 内存
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # --- 编码配置 ---
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: 1
      
      # --- 数据库配置 ---
      # PgBouncer 配置
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 5432
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      # 数据库连接池配置（优化用于 PgBouncer）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-60}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      # 直接连接 PostgreSQL 配置
      POSTGRES_SERVER: ${POSTGRES_SERVER:-db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      
      # --- Redis 配置 ---
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # --- MinIO 配置 ---
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET}
      
      # --- API 密钥 ---
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      QWEATHER_API_KEY: ${QWEATHER_API_KEY}
      GAODE_API_KEY: ${GAODE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}

      # --- 政策采集合规配置 ---
      POLICY_ONLINE_CRAWL_ENABLED: ${POLICY_ONLINE_CRAWL_ENABLED:-true}
      POLICY_SAMPLE_FALLBACK_ENABLED: ${POLICY_SAMPLE_FALLBACK_ENABLED:-true}
      POLICY_REQUIRE_ROBOTS_TXT: ${POLICY_REQUIRE_ROBOTS_TXT:-true}
      POLICY_COLLECTOR_USER_AGENT: "${POLICY_COLLECTOR_USER_AGENT:-PolicyCollector/1.0 (Enterprise Tax System; Contact: support@example.com)}"
      
      # --- 安全配置 ---
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      
      # --- 高级特性配置 ---
      ENABLE_AGENT_TRACING: ${ENABLE_AGENT_TRACING:-true}
      ENABLE_TOOL_TRACING: ${ENABLE_TOOL_TRACING:-true}
      ENABLE_PROMPT_OPTIMIZATION: ${ENABLE_PROMPT_OPTIMIZATION:-true}
      TRACE_DATA_RETENTION_DAYS: ${TRACE_DATA_RETENTION_DAYS:-30}
      
      # ==========================================
      # LangSmith 监控配置通行证
      # ==========================================
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      LANGSMITH_INTEGRATION_ENABLED: ${LANGSMITH_INTEGRATION_ENABLED}

      # --- 知识图谱配置 ---
      ENABLE_KNOWLEDGE_GRAPH: ${ENABLE_KNOWLEDGE_GRAPH:-false}
      ENABLE_ENTITY_EXTRACTION: ${ENABLE_ENTITY_EXTRACTION:-false}
      ENABLE_RELATION_EXTRACTION: ${ENABLE_RELATION_EXTRACTION:-false}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      
      # --- OCR 配置 ---
      MINERU_APISERVER: ${MINERU_APISERVER:-}
      MINERU_OUTPUT_DIR: ${MINERU_OUTPUT_DIR:-/tmp/mineru_output}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_SERVER_URL: ${MINERU_SERVER_URL:-}
      MINERU_DELETE_OUTPUT: ${MINERU_DELETE_OUTPUT:-1}
      # OCR 配置
      # PADDLEOCR_API_URL: ${PADDLEOCR_API_URL:-http://paddleocr-api:8866/predict/ocr_system}
      # PADDLEOCR_ALGORITHM: ${PADDLEOCR_ALGORITHM:-PaddleOCR-VL}
      # PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_ACCESS_TOKEN:-}
      # OCR / 视觉模型配置 (已切换为轻量级云端 VLM 方案)
      OCR_ENGINE: ${OCR_ENGINE:-siliconflow_vlm}
      
      # --- Unstructured API 重型解析引擎配置 ---
      ENABLE_UNSTRUCTURED_PARSER: ${ENABLE_UNSTRUCTURED_PARSER:-false}
      UNSTRUCTURED_API_URL: ${UNSTRUCTURED_API_URL:-http://unstructured-api:8000}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./test_templates:/app/test_templates
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

    # 给包含 OCR 和大模型调用的 Backend 设置内存上限
    deploy:
      resources:
        limits:
          memory: 2G # 即使发生死循环，最多也只能吃 2GB 内存
          
    # 日志防爆系统
    logging:
      driver: "json-file"
      options:
        max-size: "20m" # 单个日志文件最大 20MB
        max-file: "3"   # 最多保留 3 个滚动文件

  # ==========================================
  # 文档解析服务
  # ==========================================
  
  # Unstructured API - 专业文档解析微服务
  # 包含 YOLOX 和 Detectron2 版面分析模型
  # 内存需求: 2-3GB（包含深度学习模型）
  # ⚠️ 重型组件：默认不启动，需要通过 --profile heavy 或 --profile full 激活
  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: rag_unstructured_api
    restart: always
    profiles: ["heavy", "full"]
    ports:
      - "8001:8000"
    mem_limit: 4g
    environment:
      UNSTRUCTURED_SERVER_WORKERS: "1"
      LOG_LEVEL: "INFO"
      # 代理设置：通过 host.docker.internal 访问 Windows 宿主机 VPN
      HTTP_PROXY: "http://host.docker.internal:7890"
      HTTPS_PROXY: "http://host.docker.internal:7890"
      NO_PROXY: "localhost,127.0.0.1,0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

